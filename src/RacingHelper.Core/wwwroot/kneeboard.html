<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Racing Helper VR panel</title>
<style>
  :root { --bg: rgba(10, 13, 18, 0.88); --panel: rgba(255, 255, 255, 0.06); --line: rgba(255, 255, 255, 0.12); --text: #F2F5F9; --muted: #9AA4B5;
          --accent: #22D37E; --warn: #F5B942; --bad: #FF4D5E; --blue: #4DA3FF; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; color: var(--text); font: 600 26px/1.3 "Segoe UI", system-ui, sans-serif; }
  body { padding: 14px; }
  .wrap { background: var(--bg); border: 1px solid var(--line); border-radius: 22px; padding: 18px 20px; display: grid; gap: 14px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 20px; color: var(--muted); }
  .head b { color: var(--text); font-size: 22px; }
  .box { background: var(--panel); border-radius: 16px; padding: 12px 16px; }
  .label { font-size: 17px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .todo { border: 2px solid var(--warn); }
  .todo .item { font-size: 30px; color: #fff; }
  .item + .item { margin-top: 6px; }
  .muted { color: var(--muted); font-size: 21px; }
  .tyres { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; margin-top: 6px; }
  .tyres div { border-radius: 10px; padding: 6px 0; background: rgba(255,255,255,.05); border-bottom: 5px solid var(--panel); }
  .tyres small { display: block; font-size: 16px; color: var(--muted); }
  .good { color: var(--accent); } .warn { color: var(--warn); } .bad { color: var(--bad); } .blue { color: var(--blue); }
  .msgs .item { font-size: 21px; color: #DDE3EC; }
  .msgs .t { color: var(--muted); font-size: 16px; margin-right: 8px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><b id="title">Racing Helper</b><span id="session">waiting for iRacing</span></div>

  <div class="box todo hidden" id="todo-box">
    <div class="label">Change on the car</div>
    <div id="todo"></div>
  </div>

  <div class="box hidden" id="setup-box">
    <div class="label">Setup session</div>
    <div id="setup" class="muted"></div>
  </div>

  <div class="box hidden" id="pace-box">
    <div class="label">Pace</div>
    <div id="pace"></div>
    <div id="pace2" class="muted"></div>
  </div>

  <div class="box" id="tyre-box">
    <div class="label">Tyres</div>
    <div id="tyre-state">–</div>
    <div class="tyres" id="tyres"></div>
  </div>

  <div class="box" id="fuel-box">
    <div class="label">Fuel & pit</div>
    <div id="fuel">–</div>
    <div id="pit" class="muted"></div>
  </div>

  <div class="box hidden" id="crash-box">
    <div class="label">Last incident</div>
    <div id="crash" class="muted"></div>
  </div>

  <div class="box msgs">
    <div class="label">Engineer</div>
    <div id="msgs" class="muted">–</div>
  </div>
</div>
<script>
  // OpenKneeboard: ask for a portrait panel; placement, rotation, size and the show/hide button are set in OpenKneeboard.
  if (window.OpenKneeboard?.SetPreferredPixelSize) { try { window.OpenKneeboard.SetPreferredPixelSize(900, 1300); } catch { } }

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const num = v => typeof v === 'number' && isFinite(v);
  const show = (id, on) => $(id).classList.toggle('hidden', !on);
  const STATE = { cold: ['Cold, building temperature', 'blue'], ok: ['OK, push', 'good'], learning: ['Learning your normal load', 'muted'],
    'hot-front': ['Fronts overheating, cool them', 'bad'], 'hot-rear': ['Rears overheating, cool them', 'bad'], hot: ['All four overheating', 'bad'] };

  function render(s) {
    $('title').textContent = s.car || 'Racing Helper';
    const radio = { practice: 'practice radio', quali: 'quali radio', race: 'race radio', minimal: 'minimal radio' }[s.radioProfile] || '';
    $('session').textContent = s.status === 'waiting' ? 'waiting for iRacing' : [s.track, s.sessionType, radio].filter(Boolean).join(' · ');

    // everything that asks you to change something on the car, in one place
    const todo = [];
    if (s.setupInstruction) todo.push(s.setupInstruction);
    if (s.carAdvice) todo.push(s.carAdvice.replace(/^Car adjustments: /, ''));
    for (const l of s.setupSheet || []) todo.push(l);
    $('todo').innerHTML = todo.map(t => `<div class="item">• ${esc(t)}</div>`).join('');
    show('todo-box', todo.length > 0);

    const running = s.setupState && !['Off', 'Done'].includes(s.setupState);
    $('setup').textContent = s.setupStatus || '';
    show('setup-box', running || !!s.setupStatus);

    const p = s.pace;
    const lt = v => { if (!num(v)) return '–'; const m = Math.floor(v / 60), x = v - m * 60; return m ? `${m}:${x.toFixed(3).padStart(6, '0')}` : x.toFixed(3); };
    const dl = d => (d >= 0 ? '+' : '−') + Math.abs(d).toFixed(2);
    if (p && num(p.lastLap)) {
      $('pace').innerHTML = `Last <b>${lt(p.lastLap)}</b>${num(p.best) ? ` <span class="${p.lastLap <= p.best + 1e-6 ? 'good' : 'muted'}">${dl(p.lastLap - p.best)}</span> · best ${lt(p.best)}` : ''}`;
      const bits = [];
      if (num(p.trend)) bits.push(`<span class="${p.trend < -0.03 ? 'good' : p.trend > 0.03 ? 'bad' : ''}">${Math.abs(p.trend) < 0.03 ? 'steady' : p.trend < 0 ? 'faster' : 'slower'} ${dl(p.trend)}/lap</span>`);
      if (num(p.theoreticalBest) && num(p.best) && p.best - p.theoreticalBest > 0.02) bits.push(`${(p.best - p.theoreticalBest).toFixed(2)} in your best corners${p.focus ? ` (${esc(p.focus)})` : ''}`);
      $('pace2').innerHTML = bits.join(' · ');
    }
    show('pace-box', !!(p && num(p.lastLap)));

    const t = s.tyreLoad;
    if (t && t.state) {
      const [label, cls] = STATE[t.state] || [t.state, 'muted'];
      const extra = t.state === 'cold' && num(t.warmPct) ? ` · ${(t.warmPct * 100).toFixed(0)}%` : t.state.startsWith('hot') && num(t.coolLaps) ? ` · ~${t.coolLaps.toFixed(1)} laps to cool` : '';
      $('tyre-state').innerHTML = `<span class="${cls}">${esc(label)}</span><span class="muted">${esc(extra)}</span>`;
      $('tyres').innerHTML = t.hasBaseline ? ['LF', 'RF', 'LR', 'RR'].map((n, i) => {
        const v = t.load[i];
        const c = !num(v) ? 'rgba(255,255,255,.1)' : v >= 1.2 ? 'var(--bad)' : v >= 1.08 ? 'var(--warn)' : 'var(--accent)';
        return `<div style="border-bottom-color:${c}"><small>${n}</small>${num(v) ? Math.round(v * 100) + '%' : '–'}</div>`;
      }).join('') : '';
    } else { $('tyre-state').textContent = '–'; $('tyres').innerHTML = ''; }

    const f = s.fuel;
    $('fuel').innerHTML = f && num(f.lapsInTank)
      ? `${f.fuelLevel.toFixed(1)} L · <b>${f.lapsInTank.toFixed(1)}</b> laps${num(f.fuelToAdd) && num(f.spare) ? (f.fuelToAdd > 0.1 ? ` · <span class="warn">add ${Math.ceil(f.fuelToAdd)} L</span>` : ` · <span class="good">${f.spare.toFixed(1)} L spare</span>`) : ''}`
      : '–';
    $('pit').textContent = s.pitPlan || '';

    $('crash').textContent = s.lastCrash || '';
    show('crash-box', !!s.lastCrash);

    const msgs = (s.messages || []).filter(m => m.speak !== false).slice(-4).reverse();
    $('msgs').innerHTML = msgs.length ? msgs.map(m => `<div class="item"><span class="t">${new Date(m.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>${esc(m.text)}</div>`).join('') : '–';
  }

  function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws/live`);
    ws.onmessage = e => { try { render(JSON.parse(e.data)); } catch { } };
    ws.onclose = () => setTimeout(connect, 1500);
  }
  connect();
</script>
</body>
</html>
